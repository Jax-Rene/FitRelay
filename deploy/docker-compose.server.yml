services:
  api:
    build:
      context: ../services/api
    restart: unless-stopped
    env_file:
      - /opt/fitrelay/shared/.env
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - /opt/fitrelay/data:/app/data
    healthcheck:
      test:
        - CMD
        - /app/api
        - healthcheck
        - --url
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
